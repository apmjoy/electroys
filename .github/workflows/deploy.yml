name: Build & deploy

on:
  push:
    branches: [main]
  # Daily: refresh brand prices + Amazon data, rebuild, publish.
  # Amazon requires displayed prices to be no more than 24 hours old.
  schedule:
    - cron: '0 10 * * *' # every day 10:00 UTC (~4–5am US Central)
  workflow_dispatch:

permissions:
  contents: write # lets the daily run commit refreshed brand prices
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Refresh brand list prices
        if: github.event_name != 'push'
        run: node scripts/refresh-brand-prices.mjs

      - name: Save refreshed prices (price history lives in git)
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- src/data/products.json; then
            git config user.name "electroys-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Daily brand price refresh ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fetch Amazon prices & photos (when API keys are configured)
        env:
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
        run: node scripts/refresh-amazon.mjs

      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
